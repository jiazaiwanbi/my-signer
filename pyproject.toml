[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-signer"
version = "0.1.0"
description = "Run Telegram check-ins once; let Qinglong handle the schedule."
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
  "kurigram==2.2.12", "Telethon==1.42.0", "loguru>=0.7,<1",
  "pydantic>=2.10,<3", "PySocks>=1.7,<2",
]

[project.optional-dependencies]
ocr = ["ddddocrfix==1.5.5", "Pillow>=10", "numpy<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11"]

[project.scripts]
my-signer = "my_signer.cli:main"

[tool.setuptools.packages.find]
include = ["my_signer*"]

[tool.setuptools.package-data]
my_signer = ["sites.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
exclude = ["my_signer/telegram/checkiner"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
